services:

  postgres:
    image: postgres:16
    container_name: lgnm-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: lgnm-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@libyamonitor.local
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "8081:80"

    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lgnm-n8n

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5680:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: postgres123

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      GENERIC_TIMEZONE: Africa/Tripoli

    volumes:
      - n8n_data:/home/node/.n8n

volumes:

  postgres_data:

  n8n_data: